<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.M.A.R.T. INDUSTRIAL</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-industrial: #0a0a0a; --panel-bg: #141414; --text-main: #e0e0e0; --industrial-amber: #ffb100; --border-color: #333; }
        body, html { height: 100%; font-family: 'Roboto Mono', monospace; background-color: var(--bg-industrial); color: var(--text-main); margin: 0; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .tabs-nav { display: flex; background: #000; border-bottom: 2px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .tab-btn { flex: 1; padding: 18px 5px; background: none; border: none; color: #666; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .tab-btn.active { color: var(--industrial-amber); border-bottom: 3px solid var(--industrial-amber); }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; margin-bottom: 12px; border-radius: 4px; }
        .btn-action { width: 100%; padding: 18px; background: var(--industrial-amber); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; color: #000; font-family: inherit; margin-bottom: 10px; }
        .form-control { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; }
        select.form-control { color: var(--industrial-amber); font-weight: bold; }
    </style>
</head>
<body>

    <nav class="tabs-nav">
        <button class="tab-btn active" onclick="openTab('dashboard')">Inicio</button>
        <button class="tab-btn" onclick="openTab('maquinas')">Flota</button>
        <button class="tab-btn" onclick="openTab('operadores')">Personal</button>
    </nav>

    <div class="container">
        <!-- PANTALLA DE INICIO (DASHBOARD) -->
        <div id="dashboard" class="view active">
            <div class="card">
                <h3>SELECCIÓN DE EMPRESA</h3>
                <select id="select-empresa" class="form-control" onchange="seleccionarEmpresa()">
                    <option value="">-- Seleccionar Empresa --</option>
                </select>
                
                <div id="nueva-empresa-box" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
                    <input type="text" id="nombre-empresa" class="form-control" placeholder="Nombre de nueva empresa">
                    <button class="btn-action" style="padding: 10px; font-size: 0.7rem;" onclick="guardarEmpresa()">+ AGREGAR EMPRESA</button>
                </div>
            </div>

            <button class="btn-action" onclick="startScanner()">📷 ESCANEAR QR</button>
            <div id="reader"></div>
            
            <div class="card">
                <h3>ESTADO</h3>
                <p id="empresa-actual">Empresa: Ninguna seleccionada</p>
                <p id="sync-status" style="color: #00b894;">● SISTEMA SINCRONIZADO</p>
            </div>
        </div>

        <!-- FLOTA -->
        <div id="maquinas" class="view">
            <div class="card">
                <h3>GESTIÓN DE FLOTA</h3>
                <div id="lista-maquinas"></div>
            </div>
        </div>

        <!-- PERSONAL -->
        <div id="operadores" class="view">
            <div class="card">
                <h3>PERSONAL ACTIVO</h3>
                <div id="lista-personal"></div>
            </div>
        </div>
    </div>

    <!-- SDK DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHOQe6J4bXbsqF_9v8xz41PJs1u9Zgyh8",
            authDomain: "smart-machine-b7054.firebaseapp.com",
            projectId: "smart-machine-b7054",
            storageBucket: "smart-machine-b7054.firebasestorage.app",
            messagingSenderId: "147783686040",
            appId: "1:147783686040:web:2d60987de05f513b31fded"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        enableIndexedDbPersistence(db).catch((err) => console.error(err));

        // GUARDAR EMPRESA EN FIREBASE
        window.guardarEmpresa = async () => {
            const nombre = document.getElementById('nombre-empresa').value;
            if(nombre) {
                await addDoc(collection(db, "empresas"), { nombre: nombre.toUpperCase() });
                document.getElementById('nombre-empresa').value = '';
            }
        };

        // LEER EMPRESAS EN TIEMPO REAL
        onSnapshot(collection(db, "empresas"), (snapshot) => {
            const select = document.getElementById('select-empresa');
            select.innerHTML = '<option value="">-- Seleccionar Empresa --</option>';
            snapshot.forEach((doc) => {
                const data = doc.data();
                select.innerHTML += `<option value="${data.nombre}">${data.nombre}</option>`;
            });
        });

        window.seleccionarEmpresa = () => {
            const seleccionada = document.getElementById('select-empresa').value;
            document.getElementById('empresa-actual').innerText = "Empresa: " + (seleccionada || "Ninguna");
            // Aquí se puede añadir lógica para filtrar la flota por empresa más adelante
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>

    <script>
        function openTab(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
