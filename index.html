<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.M.A.R.T. INDUSTRIAL</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-industrial: #0a0a0a; --panel-bg: #141414; --text-main: #e0e0e0; --industrial-amber: #ffb100; --border-color: #333; --success-green: #00b894; }
        body, html { height: 100%; font-family: 'Roboto Mono', monospace; background-color: var(--bg-industrial); color: var(--text-main); margin: 0; }
        .container { padding: 20px; max-width: 900px; margin: auto; padding-bottom: 100px; }
        .tabs-nav { display: flex; background: #000; border-bottom: 2px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .tab-btn { flex: 1; padding: 18px 5px; background: none; border: none; color: #666; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .tab-btn.active { color: var(--industrial-amber); border-bottom: 3px solid var(--industrial-amber); }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; margin-bottom: 12px; border-radius: 4px; }
        .btn-action { width: 100%; padding: 18px; background: var(--industrial-amber); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; color: #000; font-family: inherit; margin-bottom: 10px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto 20px; display: none; border: 2px solid var(--industrial-amber); }
        .admin-form { background: #1a1a1a; padding: 15px; border: 1px solid var(--industrial-amber); margin-bottom: 20px; display: none; }
        .form-control { width: 100%; padding: 10px; background: #000; border: 1px solid #444; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="main-app">
        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="openTab('dashboard')">Inicio</button>
            <button class="tab-btn" onclick="openTab('maquinas')">Flota</button>
            <button class="tab-btn" onclick="openTab('operadores')">Personal</button>
        </nav>

        <div class="container">
            <!-- INICIO -->
            <div id="dashboard" class="view active">
                <button class="btn-action" onclick="startScanner()">📷 ESCANEAR QR</button>
                <div id="reader"></div>
                <div class="card">
                    <h3>ESTADO DEL SISTEMA</h3>
                    <p id="sync-status" style="color: var(--success-green);">● NUBE ACTIVA (OFFLINE READY)</p>
                </div>
            </div>

            <!-- FLOTA -->
            <div id="maquinas" class="view">
                <button class="btn-action" onclick="toggleElement('form-flota')">+ AGREGAR VEHÍCULO</button>
                <div id="form-flota" class="admin-form">
                    <input type="text" id="id-maq" class="form-control" placeholder="ID (Ej: NV200-01)">
                    <input type="text" id="mod-maq" class="form-control" placeholder="Modelo">
                    <input type="number" id="año-maq" class="form-control" placeholder="Año (Ej: 2024)">
                    <button class="btn-action" onclick="addMachine()">GUARDAR EN NUBE</button>
                </div>
                <div id="lista-maquinas"></div>
            </div>

            <!-- PERSONAL -->
            <div id="operadores" class="view">
                <button class="btn-action" onclick="toggleElement('form-personal')">+ REGISTRAR OPERADOR</button>
                <div id="form-personal" class="admin-form">
                    <input type="text" id="nom-ope" class="form-control" placeholder="Nombre completo">
                    <input type="text" id="cargo-ope" class="form-control" placeholder="Cargo/Especialidad">
                    <button class="btn-action" onclick="addOperator()">REGISTRAR</button>
                </div>
                <div id="lista-personal"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHOQe6J4bXbsqF_9v8xz41PJs1u9Zgyh8",
            authDomain: "smart-machine-b7054.firebaseapp.com",
            projectId: "smart-machine-b7054",
            storageBucket: "smart-machine-b7054.firebasestorage.app",
            messagingSenderId: "147783686040",
            appId: "1:147783686040:web:2d60987de05f513b31fded"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        enableIndexedDbPersistence(db).catch((err) => console.error("Modo offline activado localmente"));

        // LÓGICA DE MÁQUINAS (Actualizada con Año)
        window.addMachine = async () => {
            const id = document.getElementById('id-maq').value;
            const modelo = document.getElementById('mod-maq').value;
            const año = document.getElementById('año-maq').value;
            if(id && modelo && año) {
                await addDoc(collection(db, "flota"), { id, modelo, año, fecha: new Date() });
                document.getElementById('id-maq').value = '';
                document.getElementById('mod-maq').value = '';
                document.getElementById('año-maq').value = '';
                toggleElement('form-flota');
            } else {
                alert("Por favor rellena todos los campos");
            }
        };

        onSnapshot(collection(db, "flota"), (snapshot) => {
            const container = document.getElementById('lista-maquinas');
            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="card">
                        <strong>${data.id}</strong><br>
                        MOD: ${data.modelo}<br>
                        AÑO: ${data.año || 'N/A'}
                    </div>`;
            });
        });

        // LÓGICA DE OPERADORES
        window.addOperator = async () => {
            const nombre = document.getElementById('nom-ope').value;
            const cargo = document.getElementById('cargo-ope').value;
            if(nombre && cargo) {
                await addDoc(collection(db, "operadores"), { nombre, cargo, fecha: new Date() });
                document.getElementById('nom-ope').value = '';
                document.getElementById('cargo-ope').value = '';
                toggleElement('form-personal');
            }
        };

        onSnapshot(collection(db, "operadores"), (snapshot) => {
            const container = document.getElementById('lista-personal');
            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                container.innerHTML += `<div class="card" style="border-left: 4px solid var(--success-green)"><strong>${data.nombre}</strong><br>${data.cargo}</div>`;
            });
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        function openTab(name) {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.getElementById(name).style.display = 'block';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        function toggleElement(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }
        let scanner = null;
        function startScanner() {
            const reader = document.getElementById('reader');
            reader.style.display = 'block';
            if(!scanner) scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                alert("QR detectado: " + text);
                scanner.stop();
                reader.style.display = 'none';
            });
        }
    </script>
</body>
</html>
